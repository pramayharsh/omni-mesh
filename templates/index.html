<!DOCTYPE html>
<html>
<head>
    <title>Omni-Mesh Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .log-container { height: 600px; overflow-y: auto; background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        .msg { border-left: 4px solid #38bdf8; margin-bottom: 15px; padding: 10px; background: #1e293b; border-radius: 0 5px 5px 0; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .badge-agent { background: #38bdf8 !important; color: #0f172a !important; font-weight: bold; }
        .task-type { color: #818cf8; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
        .payload-preview { color: #94a3b8; font-size: 0.85rem; background: #0f172a; padding: 5px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>🌐 Omni-Mesh Swarm Monitor</h1>
        <span id="status-badge" class="badge bg-danger">Disconnected</span>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card bg-dark text-white p-4 border-secondary">
                <h4 class="mb-3 text-info">Trigger Swarm</h4>
                <div class="mb-3">
                    <label class="form-label">Report Topic</label>
                    <input id="topic" class="form-control bg-secondary text-white border-0" placeholder="e.g. 2024 Strategy">
                </div>
                <div class="mb-3">
                    <label class="form-label">Knowledge Injection</label>
                    <textarea id="content" class="form-control bg-secondary text-white border-0" rows="5" placeholder="Feed facts to the Librarian..."></textarea>
                </div>
                <button id="run-btn" onclick="runSwarm()" class="btn btn-primary w-100 fw-bold">🚀 ACTIVATE SWARM</button>
            </div>
        </div>
        <div class="col-md-8">
            <h4 class="text-info">Live Mesh Traffic</h4>
            <div id="logs" class="log-container">
                <div class="text-muted text-center mt-5">Waiting for agent activity...</div>
            </div>
        </div>
    </div>

    <script>
        // Use the correct WebSocket protocol (ws or wss)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
        const logs = document.getElementById('logs');
        const statusBadge = document.getElementById('status-badge');

        ws.onopen = () => {
            statusBadge.textContent = 'Live Mesh Connected';
            statusBadge.className = 'badge bg-success';
        };

        ws.onclose = () => {
            statusBadge.textContent = 'Disconnected';
            statusBadge.className = 'badge bg-danger';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Remove the placeholder text on first message
            if(logs.innerText.includes("Waiting")) logs.innerHTML = "";

            const div = document.createElement('div');
            div.className = 'msg shadow-sm';
            div.innerHTML = `
                <div class="d-flex justify-content-between">
                    <span class="badge badge-agent">${data.sender}</span>
                    <span class="text-muted small">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="mt-1">
                    <i class="text-white">sends to</i> 
                    <span class="badge bg-secondary">${data.receiver}</span>
                </div>
                <div class="task-type mt-1">${data.task_type}</div>
                <div class="payload-preview">${JSON.stringify(data.payload).substring(0, 150)}...</div>
            `;
            logs.prepend(div);
        };

        async function runSwarm() {
            const topic = document.getElementById('topic').value;
            const content = document.getElementById('content').value;
            const btn = document.getElementById('run-btn');

            if(!topic || !content) {
                alert("Please fill in both fields");
                return;
            }

            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            try {
                // Sending data as Query Parameters to match your FastAPI endpoint
                const url = `/run?topic=${encodeURIComponent(topic)}&content=${encodeURIComponent(content)}`;
                const response = await fetch(url, { method: 'POST' });
                const result = await response.json();
                console.log("Swarm response:", result);
            } catch (err) {
                console.error("Failed to trigger swarm:", err);
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 ACTIVATE SWARM";
            }
        }
    </script>
</body>
</html>
